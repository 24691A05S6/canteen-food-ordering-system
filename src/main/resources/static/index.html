<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">🍴 Campus Canteen</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
            </ul>
            <a href="cart.html" class="nav-link text-white position-relative me-2">
                🛒 Cart <span class="cart-badge" id="cartCount">0</span>
            </a>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero">
    <h1>Campus Canteen</h1>
    <p>Order your favourite food, skip the queue.</p>
    <a href="menu.html" class="btn btn-order">Order Now</a>
</section>

<!-- Search -->
<div class="search-bar">
    <input type="text" id="homeSearchInput" placeholder="Search for food...">
    <button onclick="goToMenuWithSearch()">Search</button>
</div>

<!-- Categories -->
<div class="category-bar">
    <button class="category-btn" onclick="goToMenuWithCategory('All')">All</button>
    <button class="category-btn" onclick="goToMenuWithCategory('Rice')">Rice</button>
    <button class="category-btn" onclick="goToMenuWithCategory('Snacks')">Snacks</button>
    <button class="category-btn" onclick="goToMenuWithCategory('South Indian')">South Indian</button>
    <button class="category-btn" onclick="goToMenuWithCategory('Beverages')">Beverages</button>
</div>

<h2 class="section-title">Featured Items</h2>
<div class="food-grid" id="featuredFoods"></div>

<footer>
    &copy; 2026 Campus Canteen. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
    function goToMenuWithSearch() {
        const keyword = document.getElementById("homeSearchInput").value.trim();
        window.location.href = "menu.html" + (keyword ? "?search=" + encodeURIComponent(keyword) : "");
    }

    function goToMenuWithCategory(category) {
        window.location.href = "menu.html?category=" + encodeURIComponent(category);
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const foods = await fetchAllFoods();
        renderFoodCards(foods.slice(0, 8), "featuredFoods");
    });
</script>

</body>
</html>
