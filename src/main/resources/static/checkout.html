<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">🍴 Campus Canteen</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
            </ul>
            <a href="cart.html" class="nav-link text-white position-relative me-2">
                🛒 Cart <span class="cart-badge" id="cartCount">0</span>
            </a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h2 class="section-title">Checkout</h2>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="bg-white rounded shadow-sm p-4">
                <h5 class="mb-3">Delivery Details</h5>
                <form id="checkoutForm">
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control" id="studentName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="studentId" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="studentPhone" required pattern="[0-9]{10}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Delivery Option</label>
                        <select class="form-select" id="deliveryOption">
                            <option value="Pickup">Pickup at Canteen</option>
                            <option value="Delivery">Deliver to Hostel/Classroom</option>
                        </select>
                    </div>
                    <button type="submit" class="btn w-100 text-white" style="background-color: var(--primary);">
                        Place Order
                    </button>
                </form>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="bg-white rounded shadow-sm p-4">
                <h5 class="mb-3">Order Summary</h5>
                <div id="summaryItems"></div>
                <hr>
                <div class="d-flex justify-content-between">
                    <strong>Total</strong>
                    <strong id="summaryTotal" style="color: var(--primary);">₹0.00</strong>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 Campus Canteen. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
    function renderSummary() {
        const container = document.getElementById("summaryItems");
        const totalEl = document.getElementById("summaryTotal");

        if (cart.length === 0) {
            container.innerHTML = '<p class="text-muted">Your cart is empty.</p>';
            totalEl.textContent = "₹0.00";
            return;
        }

        container.innerHTML = cart.map(item => `
            <div class="d-flex justify-content-between mb-2">
                <span>${item.name} × ${item.quantity}</span>
                <span>₹${(item.price * item.quantity).toFixed(2)}</span>
            </div>
        `).join('');

        totalEl.textContent = "₹" + getCartTotal().toFixed(2);
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateCartBadge();
        renderSummary();

        if (cart.length === 0) {
            document.getElementById("checkoutForm").querySelector("button").disabled = true;
        }

        document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            const orderData = {
                studentName: document.getElementById("studentName").value,
                studentId: document.getElementById("studentId").value,
                studentPhone: document.getElementById("studentPhone").value,
                deliveryOption: document.getElementById("deliveryOption").value,
                items: cart.map(item => ({ foodId: item.id, quantity: item.quantity }))
            };

            const submitBtn = e.target.querySelector("button");
            submitBtn.disabled = true;
            submitBtn.textContent = "Placing order...";

            const result = await placeOrder(orderData);
            if (result && result.orderNumber) {
                localStorage.setItem("lastStudentId", orderData.studentId);
                cart = [];
                saveCart();
                alert("Order placed successfully! Your order number is " + result.orderNumber);
                window.location.href = "orders.html";
            } else {
                alert("Something went wrong placing your order. Please try again.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Place Order";
            }
        });
    });
</script>

</body>
</html>
