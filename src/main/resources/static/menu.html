<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">🍴 Campus Canteen</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="menu.html">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
            </ul>
            <a href="cart.html" class="nav-link text-white position-relative me-2">
                🛒 Cart <span class="cart-badge" id="cartCount">0</span>
            </a>
        </div>
    </div>
</nav>

<h2 class="section-title">Our Menu</h2>

<div class="search-bar" style="margin-top: 0;">
    <input type="text" id="searchInput" placeholder="Search for food...">
    <button onclick="handleSearch()">Search</button>
</div>

<div class="category-bar" id="categoryBar">
    <button class="category-btn active" data-category="All">All</button>
    <button class="category-btn" data-category="Rice">Rice</button>
    <button class="category-btn" data-category="Snacks">Snacks</button>
    <button class="category-btn" data-category="South Indian">South Indian</button>
    <button class="category-btn" data-category="Beverages">Beverages</button>
</div>

<div class="food-grid" id="foodGrid"></div>

<footer>
    &copy; 2026 Campus Canteen. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
    async function loadAll() {
        renderFoodCards(await fetchAllFoods(), "foodGrid");
    }

    async function loadCategory(category) {
        const foods = category === "All" ? await fetchAllFoods() : await fetchFoodsByCategory(category);
        renderFoodCards(foods, "foodGrid");
    }

    async function handleSearch() {
        const keyword = document.getElementById("searchInput").value.trim();
        if (!keyword) { loadAll(); return; }
        renderFoodCards(await searchFoods(keyword), "foodGrid");
    }

    function setActiveCategory(category) {
        document.querySelectorAll("#categoryBar .category-btn").forEach(btn => {
            btn.classList.toggle("active", btn.dataset.category === category);
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("#categoryBar .category-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                setActiveCategory(btn.dataset.category);
                loadCategory(btn.dataset.category);
            });
        });

        document.getElementById("searchInput").addEventListener("keydown", e => {
            if (e.key === "Enter") handleSearch();
        });

        const params = new URLSearchParams(window.location.search);
        const search = params.get("search");
        const category = params.get("category");

        if (search) {
            document.getElementById("searchInput").value = search;
            handleSearch();
        } else if (category) {
            setActiveCategory(category);
            loadCategory(category);
        } else {
            loadAll();
        }
    });
</script>

</body>
</html>
