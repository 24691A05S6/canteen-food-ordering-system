<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: var(--secondary);">

<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="bg-white rounded shadow-sm p-4" style="width: 100%; max-width: 380px;">
        <h3 class="text-center mb-1">🍴 Campus Canteen</h3>
        <p class="text-center text-muted mb-4">Admin Login</p>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div id="errorMsg" class="text-danger small mb-3" style="display:none;"></div>
            <button type="submit" class="btn w-100 text-white" style="background-color: var(--primary);">
                Login
            </button>
        </form>
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.style.display = "none";

        try {
            const response = await fetch("/api/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const result = await response.json();

            if (result.success) {
                localStorage.setItem("isAdminLoggedIn", "true");
                window.location.href = "admin-dashboard.html";
            } else {
                errorMsg.textContent = result.message;
                errorMsg.style.display = "block";
            }
        } catch (error) {
            errorMsg.textContent = "Something went wrong. Please try again.";
            errorMsg.style.display = "block";
        }
    });
</script>

</body>
</html>
