<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">🍴 Campus Canteen</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            </ul>
            <a href="cart.html" class="nav-link text-white position-relative me-2">
                🛒 Cart <span class="cart-badge" id="cartCount">0</span>
            </a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h2 class="section-title">Your Cart</h2>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="table-responsive bg-white rounded shadow-sm">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Item</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="cartItems"></tbody>
                </table>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="bg-white rounded shadow-sm p-3">
                <h5 class="mb-3">Order Summary</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal</span>
                    <span id="cartSubtotal">₹0.00</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-3">
                    <strong>Total</strong>
                    <strong id="cartTotal" style="color: var(--primary);">₹0.00</strong>
                </div>
                <a href="checkout.html" id="checkoutBtn" class="btn w-100 text-white" style="background-color: var(--primary);">Proceed to Checkout</a>
                <a href="menu.html" class="btn btn-outline-secondary w-100 mt-2">Add More Items</a>
            </div>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 Campus Canteen. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
