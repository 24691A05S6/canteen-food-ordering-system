<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="admin-dashboard.html">🍴 Campus Canteen Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="manage-food.html">Manage Food</a></li>
                <li class="nav-item"><a class="nav-link active" href="manage-orders.html">Manage Orders</a></li>
            </ul>
            <button class="btn btn-outline-light btn-sm" onclick="adminLogout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h2 class="section-title">Manage Orders</h2>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>Order #</th>
                <th>Student</th>
                <th>Items</th>
                <th>Total</th>
                <th>Date</th>
                <th>Status</th>
                <th>Change Status</th>
            </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    function adminLogout() {
        localStorage.removeItem("isAdminLoggedIn");
        window.location.href = "admin-login.html";
    }

    const STATUS_OPTIONS = ["PENDING", "CONFIRMED", "PREPARING", "READY", "COMPLETED", "CANCELLED"];

    function statusBadgeClass(status) {
        return "status-" + status.toLowerCase();
    }

    async function loadOrders() {
        const res = await fetch("/api/orders");
        const orders = await res.json();

        document.getElementById("ordersTableBody").innerHTML = orders.map(order => `
            <tr>
                <td><strong>${order.orderNumber}</strong></td>
                <td>${order.studentName}<br><small class="text-muted">${order.studentId}</small></td>
                <td>${order.items.map(i => `${i.foodItem.name} × ${i.quantity}`).join('<br>')}</td>
                <td>₹${order.totalAmount.toFixed(2)}</td>
                <td>${new Date(order.orderDate).toLocaleString()}</td>
                <td><span class="badge-status ${statusBadgeClass(order.status)}">${order.status}</span></td>
                <td>
                    <select class="form-select form-select-sm" onchange="changeStatus(${order.id}, this.value)" style="min-width:140px;">
                        ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === order.status ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                </td>
            </tr>
        `).join('');
    }

    async function changeStatus(orderId, newStatus) {
        await fetch(`/api/orders/${orderId}/status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: newStatus })
        });
        loadOrders();
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("isAdminLoggedIn") !== "true") {
            window.location.href = "admin-login.html";
            return;
        }
        loadOrders();
    });
</script>

</body>
</html>
