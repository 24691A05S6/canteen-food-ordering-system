<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .stat-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            padding: 1.3rem;
            text-align: center;
        }
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-card .label {
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="admin-dashboard.html">🍴 Campus Canteen Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link active" href="admin-dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="manage-food.html">Manage Food</a></li>
                <li class="nav-item"><a class="nav-link" href="manage-orders.html">Manage Orders</a></li>
            </ul>
            <button class="btn btn-outline-light btn-sm" onclick="adminLogout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h2 class="section-title">Dashboard</h2>

    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-2">
            <div class="stat-card">
                <div class="value" id="totalFoods">-</div>
                <div class="label">Total Food Items</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="stat-card">
                <div class="value" id="availableFoods">-</div>
                <div class="label">Available Items</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="stat-card">
                <div class="value" id="totalOrders">-</div>
                <div class="label">Total Orders</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="stat-card">
                <div class="value" id="pendingOrders">-</div>
                <div class="label">Pending Orders</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="stat-card">
                <div class="value" id="completedOrders">-</div>
                <div class="label">Completed Orders</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
            <div class="stat-card">
                <div class="value" id="totalSales">-</div>
                <div class="label">Total Sales</div>
            </div>
        </div>
    </div>
</div>

<script>
    function adminLogout() {
        localStorage.removeItem("isAdminLoggedIn");
        window.location.href = "admin-login.html";
    }

    async function loadDashboard() {
        try {
            const [foodsRes, statsRes] = await Promise.all([
                fetch("/api/foods"),
                fetch("/api/orders/stats")
            ]);
            const foods = await foodsRes.json();
            const stats = await statsRes.json();

            document.getElementById("totalFoods").textContent = foods.length;
            document.getElementById("availableFoods").textContent = foods.filter(f => f.available).length;
            document.getElementById("totalOrders").textContent = stats.totalOrders;
            document.getElementById("pendingOrders").textContent = stats.pendingOrders;
            document.getElementById("completedOrders").textContent = stats.completedOrders;
            document.getElementById("totalSales").textContent = "₹" + stats.totalSales.toFixed(2);
        } catch (error) {
            console.error("Error loading dashboard:", error);
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("isAdminLoggedIn") !== "true") {
            window.location.href = "admin-login.html";
            return;
        }
        loadDashboard();
    });
</script>

</body>
</html>
