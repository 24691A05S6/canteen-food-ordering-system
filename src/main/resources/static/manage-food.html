<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Food - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="admin-dashboard.html">🍴 Campus Canteen Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="manage-food.html">Manage Food</a></li>
                <li class="nav-item"><a class="nav-link" href="manage-orders.html">Manage Orders</a></li>
            </ul>
            <button class="btn btn-outline-light btn-sm" onclick="adminLogout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="section-title mb-0">Manage Food</h2>
        <button class="btn text-white" style="background-color: var(--primary);" onclick="openAddModal()">+ Add Food Item</button>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Available</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="foodTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="foodModalBackdrop" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div class="bg-white rounded shadow p-4" style="width:100%; max-width:450px; margin: 1rem;">
        <h5 id="modalTitle" class="mb-3">Add Food Item</h5>
        <form id="foodForm">
            <input type="hidden" id="foodId">
            <div class="mb-2">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" id="foodName" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="foodDescription" rows="2" required></textarea>
            </div>
            <div class="mb-2">
                <label class="form-label">Price (₹)</label>
                <input type="number" step="0.01" class="form-control" id="foodPrice" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Category</label>
                <select class="form-select" id="foodCategory" required>
                    <option value="Rice">Rice</option>
                    <option value="Main Course">Main Course</option>
                    <option value="Snacks">Snacks</option>
                    <option value="South Indian">South Indian</option>
                    <option value="Beverages">Beverages</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Image URL</label>
                <input type="text" class="form-control" id="foodImageUrl" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="foodAvailable" checked>
                <label class="form-check-label" for="foodAvailable">Available</label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn text-white flex-fill" style="background-color: var(--primary);">Save</button>
                <button type="button" class="btn btn-outline-secondary flex-fill" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    function adminLogout() {
        localStorage.removeItem("isAdminLoggedIn");
        window.location.href = "admin-login.html";
    }

    let allFoods = [];

    function renderTable() {
        const tbody = document.getElementById("foodTableBody");
        tbody.innerHTML = allFoods.map(f => `
            <tr>
                <td><img src="${f.imageUrl}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;" onerror="this.src='https://via.placeholder.com/50?text=Food'"></td>
                <td>${f.name}</td>
                <td>${f.category}</td>
                <td>₹${f.price.toFixed(2)}</td>
                <td>${f.available ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-secondary me-1" onclick="openEditModal(${f.id})">Edit</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteFood(${f.id})">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function loadFoods() {
        const res = await fetch("/api/foods");
        allFoods = await res.json();
        renderTable();
    }

    function openAddModal() {
        document.getElementById("modalTitle").textContent = "Add Food Item";
        document.getElementById("foodForm").reset();
        document.getElementById("foodId").value = "";
        document.getElementById("foodAvailable").checked = true;
        document.getElementById("foodModalBackdrop").style.display = "flex";
    }

    function openEditModal(id) {
        const food = allFoods.find(f => f.id === id);
        if (!food) return;
        document.getElementById("modalTitle").textContent = "Edit Food Item";
        document.getElementById("foodId").value = food.id;
        document.getElementById("foodName").value = food.name;
        document.getElementById("foodDescription").value = food.description;
        document.getElementById("foodPrice").value = food.price;
        document.getElementById("foodCategory").value = food.category;
        document.getElementById("foodImageUrl").value = food.imageUrl;
        document.getElementById("foodAvailable").checked = food.available;
        document.getElementById("foodModalBackdrop").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("foodModalBackdrop").style.display = "none";
    }

    async function deleteFood(id) {
        if (!confirm("Delete this food item?")) return;
        await fetch(`/api/foods/${id}`, { method: "DELETE" });
        loadFoods();
    }

    document.getElementById("foodForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const id = document.getElementById("foodId").value;
        const payload = {
            name: document.getElementById("foodName").value,
            description: document.getElementById("foodDescription").value,
            price: parseFloat(document.getElementById("foodPrice").value),
            category: document.getElementById("foodCategory").value,
            imageUrl: document.getElementById("foodImageUrl").value,
            available: document.getElementById("foodAvailable").checked
        };

        if (id) {
            await fetch(`/api/foods/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        } else {
            await fetch("/api/foods", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        }

        closeModal();
        loadFoods();
    });

    document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("isAdminLoggedIn") !== "true") {
            window.location.href = "admin-login.html";
            return;
        }
        loadFoods();
    });
</script>

</body>
</html>
