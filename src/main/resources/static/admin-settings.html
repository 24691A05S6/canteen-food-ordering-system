<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="admin-dashboard.html">🍴 Campus Canteen Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="manage-food.html">Manage Food</a></li>
                <li class="nav-item"><a class="nav-link" href="manage-orders.html">Manage Orders</a></li>
                <li class="nav-item"><a class="nav-link active" href="admin-settings.html">Settings</a></li>
            </ul>
            <button class="btn btn-outline-light btn-sm" onclick="adminLogout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container my-4" style="max-width: 450px;">
    <h2 class="section-title">Change Admin Credentials</h2>

    <div class="bg-white rounded shadow-sm p-4">
        <form id="credentialsForm">
            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-control" id="currentPassword" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New Username (leave blank to keep same)</label>
                <input type="text" class="form-control" id="newUsername">
            </div>
            <div class="mb-3">
                <label class="form-label">New Password (leave blank to keep same)</label>
                <input type="password" class="form-control" id="newPassword">
            </div>
            <div id="msg" class="small mb-3" style="display:none;"></div>
            <button type="submit" class="btn w-100 text-white" style="background-color: var(--primary);">
                Update Credentials
            </button>
        </form>
    </div>
</div>

<script>
    function adminLogout() {
        localStorage.removeItem("isAdminLoggedIn");
        window.location.href = "admin-login.html";
    }

    document.getElementById("credentialsForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const currentPassword = document.getElementById("currentPassword").value;
        const newUsername = document.getElementById("newUsername").value;
        const newPassword = document.getElementById("newPassword").value;
        const msg = document.getElementById("msg");

        const response = await fetch("/api/admin/change-credentials", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ currentPassword, newUsername, newPassword })
        });
        const result = await response.json();

        msg.style.display = "block";
        msg.textContent = result.message;
        msg.className = "small mb-3 " + (result.success ? "text-success" : "text-danger");

        if (result.success) {
            document.getElementById("credentialsForm").reset();
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("isAdminLoggedIn") !== "true") {
            window.location.href = "admin-login.html";
        }
    });
</script>

</body>
</html>
