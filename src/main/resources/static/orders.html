<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">🍴 Campus Canteen</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                <li class="nav-item"><a class="nav-link active" href="orders.html">My Orders</a></li>
            </ul>
            <a href="cart.html" class="nav-link text-white position-relative me-2">
                🛒 Cart <span class="cart-badge" id="cartCount">0</span>
            </a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h2 class="section-title">My Orders</h2>

    <div class="search-bar" style="margin: 0 auto 2rem auto;">
        <input type="text" id="studentIdInput" placeholder="Enter your Student ID...">
        <button onclick="loadOrders()">Find Orders</button>
    </div>

    <div id="ordersList"></div>
</div>

<footer>
    &copy; 2026 Campus Canteen. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
    function renderOrders(orders) {
        const container = document.getElementById("ordersList");

        if (!orders || orders.length === 0) {
            container.innerHTML = '<p class="text-center text-muted py-4">No orders found for this Student ID.</p>';
            return;
        }

        container.innerHTML = orders.map(order => `
            <div class="bg-white rounded shadow-sm p-3 mb-3">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                    <div>
                        <h5 class="mb-1">${order.orderNumber}</h5>
                        <small class="text-muted">${new Date(order.orderDate).toLocaleString()}</small>
                    </div>
                    <span class="badge-status ${statusBadgeClass(order.status)}">${order.status}</span>
                </div>
                <hr>
                <div class="mb-2">
                    ${order.items.map(i => `<div>${i.foodItem.name} × ${i.quantity}</div>`).join('')}
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <strong>Total: ₹${order.totalAmount.toFixed(2)}</strong>
                    <a href="order-details.html?id=${order.id}" class="btn btn-sm btn-outline-secondary">View Details</a>
                </div>
            </div>
        `).join('');
    }

    async function loadOrders() {
        const studentId = document.getElementById("studentIdInput").value.trim();
        if (!studentId) {
            alert("Please enter your Student ID.");
            return;
        }
        localStorage.setItem("lastStudentId", studentId);
        const orders = await fetchOrdersByStudent(studentId);
        renderOrders(orders);
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateCartBadge();
        const savedId = localStorage.getItem("lastStudentId");
        if (savedId) {
            document.getElementById("studentIdInput").value = savedId;
            loadOrders();
        }

        document.getElementById("studentIdInput").addEventListener("keydown", e => {
            if (e.key === "Enter") loadOrders();
        });
    });
</script>

</body>
</html>
